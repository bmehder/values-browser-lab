<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">05 / Describe, interpret, validate</title><desc id="desc">Typed effects travel out to the browser; validated results return as typed messages.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#9ae7cb" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,sans-serif}.label{font-size:23px;font-weight:600;fill:#edf6f2}.detail{font-size:18px;fill:#b9cfca}.title{font-size:30px;font-weight:600;fill:#9ae7cb}</style><rect width="1000" height="560" rx="20" fill="#081719"/><text x="36" y="55" class="title">05 / Describe, interpret, validate</text><rect x="35" y="115" width="270" height="116" rx="14" fill="#173b34" stroke="#9ae7cb"/><text x="53" y="148" class="label">Effect value</text><text x="53" y="177" class="detail">Gleam: requested work</text><path d="M310 170 L345 170" stroke="#9ae7cb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="360" y="115" width="270" height="116" rx="14" fill="#10272b" stroke="#345354"/><text x="378" y="148" class="label">perform</text><text x="378" y="177" class="detail">effects.gleam</text><path d="M635 170 L670 170" stroke="#9ae7cb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="685" y="115" width="280" height="116" rx="14" fill="#10272b" stroke="#345354"/><text x="703" y="148" class="label">Browser operation</text><text x="703" y="177" class="detail">browser.mjs → browser API</text><path d="M825 237 L825 300" stroke="#9ae7cb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="685" y="315" width="280" height="116" rx="14" fill="#10272b" stroke="#345354"/><text x="703" y="348" class="label">Validate service data</text><text x="703" y="377" class="detail">Valibot schema</text><text x="703" y="400" class="detail">Then construct Gleam values</text><path d="M680 370 L645 370" stroke="#9ae7cb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="360" y="315" width="270" height="116" rx="14" fill="#10272b" stroke="#345354"/><text x="378" y="348" class="label">Outcome callback</text><text x="378" y="377" class="detail">Wrap result in a message</text><path d="M355 370 L320 370" stroke="#9ae7cb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="35" y="315" width="270" height="116" rx="14" fill="#173b34" stroke="#9ae7cb"/><text x="53" y="348" class="label">Next message</text><text x="53" y="377" class="detail">dispatch → next turn</text><text x="35" y="510" class="detail">Types govern Gleam code. External data needs runtime validation.</text></svg>