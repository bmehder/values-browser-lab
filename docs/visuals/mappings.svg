<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc"><title id="title">A mapping can return another mapping</title><desc id="desc">Update maps a message to an operation function. Applying the operation to the current model produces a next model and effect descriptions.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#9ae7cb" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,sans-serif}</style><rect width="1000" height="630" rx="20" fill="#081719"/><text x="35" y="55" font-size="29" font-weight="600" fill="#9ae7cb">A mapping can return another mapping.</text><text x="35" y="102" font-size="20" font-weight="400" fill="#b9cfca">Choose a program value, then apply it to the current model.</text><rect x="35" y="140" width="290" height="110" rx="14" fill="#173b34" stroke="#6baf98"/><text x="55" y="177" font-size="16" font-weight="600" fill="#9ae7cb">MESSAGE</text><text x="55" y="218" font-size="22" font-weight="400" fill="#dceee8">UserSubmittedSearch</text><path d="M340 195 L465 195" fill="none" stroke="#9ae7cb" stroke-width="2" marker-end="url(#arrow)"/><text x="362" y="173" font-size="18" font-weight="400" fill="#b9cfca">update</text><rect x="485" y="140" width="480" height="110" rx="14" fill="#173b34" stroke="#6baf98"/><text x="505" y="177" font-size="16" font-weight="600" fill="#9ae7cb">OPERATION / FUNCTION VALUE</text><text x="505" y="218" font-size="23" font-weight="400" fill="#dceee8">begin_search(): Model → Turn</text><path d="M725 265 L725 320" fill="none" stroke="#9ae7cb" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="340" width="290" height="110" rx="14" fill="#173b34" stroke="#6baf98"/><text x="55" y="377" font-size="16" font-weight="600" fill="#9ae7cb">CURRENT MODEL</text><text x="55" y="418" font-size="23" font-weight="400" fill="#dceee8">The situation now</text><path d="M340 395 L465 395" fill="none" stroke="#9ae7cb" stroke-width="2" marker-end="url(#arrow)"/><text x="365" y="373" font-size="18" font-weight="400" fill="#b9cfca">apply</text><rect x="485" y="340" width="480" height="110" rx="14" fill="#173b34" stroke="#6baf98"/><text x="505" y="377" font-size="16" font-weight="600" fill="#9ae7cb">TURN / PAIR OF VALUES</text><text x="505" y="418" font-size="23" font-weight="400" fill="#dceee8">#(Next model, List(Effect))</text><text x="35" y="510" font-size="23" font-weight="600" fill="#9ae7cb">One turn: Message → (Model → Next model + Effects)</text><text x="35" y="554" font-size="20" font-weight="400" fill="#b9cfca">The function is a value. Its answer contains descriptions, too.</text><text x="35" y="593" font-size="17" font-weight="400" fill="#b9cfca">Turn is a shorthand in this diagram, not a type alias in the code.</text></svg>