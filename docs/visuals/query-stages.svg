<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">07 / A query earns its next type</title><desc id="desc">Preparation either rejects an empty query or produces the searchable stage.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#9ae7cb" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,sans-serif}.label{font-size:23px;font-weight:600;fill:#edf6f2}.detail{font-size:18px;fill:#b9cfca}.title{font-size:30px;font-weight:600;fill:#9ae7cb}</style><rect width="1000" height="560" rx="20" fill="#081719"/><text x="36" y="55" class="title">07 / A query earns its next type</text><rect x="35" y="120" width="270" height="116" rx="14" fill="#10272b" stroke="#345354"/><text x="53" y="153" class="label">Query(Unchecked)</text><text x="53" y="182" class="detail">Created from input</text><path d="M310 175 L345 175" stroke="#9ae7cb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="360" y="120" width="270" height="116" rx="14" fill="#173b34" stroke="#9ae7cb"/><text x="378" y="153" class="label">prepare</text><text x="378" y="182" class="detail">Trim + reject empty</text><path d="M635 175 L670 175" stroke="#9ae7cb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="685" y="120" width="280" height="116" rx="14" fill="#173b34" stroke="#9ae7cb"/><text x="703" y="153" class="label">Query(Searchable)</text><text x="703" y="182" class="detail">Accepted by SearchService</text><path d="M495 242 L495 320" stroke="#9ae7cb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="360" y="335" width="270" height="116" rx="14" fill="#10272b" stroke="#345354"/><text x="378" y="368" class="label">Error(EmptyQuery)</text><text x="378" y="397" class="detail">No search effect requested</text><text x="35" y="505" class="detail">The stage is a type parameter. No stage marker is stored at runtime.</text></svg>