<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">06 / One model, two descriptions</title><desc id="desc">View derives a screen description. Subscriptions derives ongoing input descriptions.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#9ae7cb" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,sans-serif}.label{font-size:23px;font-weight:600;fill:#edf6f2}.detail{font-size:18px;fill:#b9cfca}.title{font-size:30px;font-weight:600;fill:#9ae7cb}</style><rect width="1000" height="560" rx="20" fill="#081719"/><text x="36" y="55" class="title">06 / One model, two descriptions</text><rect x="335" y="95" width="330" height="116" rx="14" fill="#173b34" stroke="#9ae7cb"/><text x="353" y="128" class="label">Retained model</text><text x="353" y="157" class="detail">What the application knows</text><path d="M415 215 L250 290" stroke="#9ae7cb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M585 215 L750 290" stroke="#9ae7cb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="35" y="305" width="430" height="116" rx="14" fill="#10272b" stroke="#345354"/><text x="53" y="338" class="label">view(model) → Screen</text><text x="53" y="367" class="detail">Words, links, labels → render DOM</text><rect x="535" y="305" width="430" height="116" rx="14" fill="#10272b" stroke="#345354"/><text x="553" y="338" class="label">subscriptions(model)</text><text x="553" y="367" class="detail">[EverySecond] or [] → reconcile interval</text><text x="35" y="505" class="detail">An effect requests an action. A subscription describes an ongoing input.</text></svg>