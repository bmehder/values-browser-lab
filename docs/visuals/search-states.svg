<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">03 / Give state a vocabulary</title><desc id="desc">Four named states carry the information relevant to that alternative.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#9ae7cb" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,sans-serif}.label{font-size:23px;font-weight:600;fill:#edf6f2}.detail{font-size:18px;fill:#b9cfca}.title{font-size:30px;font-weight:600;fill:#9ae7cb}</style><rect width="1000" height="560" rx="20" fill="#081719"/><text x="36" y="55" class="title">03 / Give state a vocabulary</text><rect x="35" y="110" width="430" height="116" rx="14" fill="#10272b" stroke="#345354"/><text x="53" y="143" class="label">SearchReady</text><text x="53" y="172" class="detail">No search in progress</text><rect x="535" y="110" width="430" height="116" rx="14" fill="#173b34" stroke="#9ae7cb"/><text x="553" y="143" class="label">Searching</text><text x="553" y="172" class="detail">Request identity + prepared query</text><rect x="35" y="300" width="430" height="116" rx="14" fill="#10272b" stroke="#345354"/><text x="53" y="333" class="label">SearchSucceeded</text><text x="53" y="362" class="detail">Prepared query + stories</text><rect x="535" y="300" width="430" height="116" rx="14" fill="#10272b" stroke="#345354"/><text x="553" y="333" class="label">SearchFailed</text><text x="553" y="362" class="detail">Prepared query + failure reason</text><text x="35" y="500" class="detail">Read the state name first. Its fields explain what that state knows.</text></svg>