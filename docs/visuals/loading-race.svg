<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="645" viewBox="0 0 1000 645" role="img" aria-labelledby="title desc"><title id="title">A request finishes. The application is still waiting.</title><desc id="desc">A completes while B is pending; A finally sets the shared loading flag false.</desc><style>text{font-family:system-ui,sans-serif}</style><rect width="1000" height="645" rx="20" fill="#081719"/><text x="35" y="55" font-size="28" font-weight="600" fill="#9ae7cb">A request finishes. The application is still waiting.</text><text x="35" y="98" font-size="18" font-weight="400" fill="#b9cfca">Time flows down. Each callback can edit the same shared state.</text><text x="35" y="145" font-size="17" font-weight="600" fill="#9ae7cb">EVENT</text><text x="350" y="145" font-size="17" font-weight="600" fill="#9ae7cb">PENDING REQUESTS</text><text x="650" y="145" font-size="17" font-weight="600" fill="#9ae7cb">SHARED LOADING FLAG</text><rect x="25" y="170" width="950" height="72" rx="12" fill="#10272b" stroke="#345354"/><text x="45" y="214" font-size="22" font-weight="400" fill="#dceee8">Start A: Gleam</text><text x="365" y="214" font-size="22" font-weight="400" fill="#dceee8">A</text><text x="665" y="214" font-size="22" font-weight="400" fill="#dceee8">true</text><rect x="25" y="260" width="950" height="72" rx="12" fill="#10272b" stroke="#345354"/><text x="45" y="304" font-size="22" font-weight="400" fill="#dceee8">Start B: types</text><text x="365" y="304" font-size="22" font-weight="400" fill="#dceee8">A + B</text><text x="665" y="304" font-size="22" font-weight="400" fill="#dceee8">true</text><rect x="25" y="350" width="950" height="72" rx="12" fill="#173b34" stroke="#9ae7cb"/><text x="45" y="394" font-size="22" font-weight="400" fill="#dceee8">A completes</text><text x="365" y="394" font-size="22" font-weight="400" fill="#dceee8">B</text><text x="665" y="394" font-size="22" font-weight="400" fill="#9ae7cb">false — too early</text><rect x="25" y="440" width="950" height="72" rx="12" fill="#10272b" stroke="#345354"/><text x="45" y="484" font-size="22" font-weight="400" fill="#dceee8">B completes</text><text x="365" y="484" font-size="22" font-weight="400" fill="#dceee8">none</text><text x="665" y="484" font-size="22" font-weight="400" fill="#dceee8">false</text><text x="35" y="572" font-size="21" font-weight="400" fill="#9ae7cb">A’s finally cleans up A, but also changes a flag B still needs.</text><text x="35" y="610" font-size="18" font-weight="400" fill="#b9cfca">Reverse completion order: B shows current stories; late A overwrites them.</text></svg>