<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">01 / The whole app</title><desc id="desc">Follow the arrows from a message to decisions, execution, and outcome messages.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#9ae7cb" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,sans-serif}.label{font-size:23px;font-weight:600;fill:#edf6f2}.detail{font-size:18px;fill:#b9cfca}.title{font-size:30px;font-weight:600;fill:#9ae7cb}</style><rect width="1000" height="560" rx="20" fill="#081719"/><text x="36" y="55" class="title">01 / The whole app</text><rect x="35" y="95" width="260" height="116" rx="14" fill="#10272b" stroke="#345354"/><text x="53" y="128" class="label">Message</text><text x="53" y="157" class="detail">What happened?</text><text x="53" y="180" class="detail">model.gleam</text><path d="M300 148 L355 148" stroke="#9ae7cb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="370" y="95" width="260" height="116" rx="14" fill="#10272b" stroke="#345354"/><text x="388" y="128" class="label">Choose operation</text><text x="388" y="157" class="detail">update(message)</text><text x="388" y="180" class="detail">domain.gleam</text><path d="M635 148 L690 148" stroke="#9ae7cb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="705" y="95" width="260" height="116" rx="14" fill="#173b34" stroke="#9ae7cb"/><text x="723" y="128" class="label">Apply to model</text><text x="723" y="157" class="detail">Next model + effects</text><text x="723" y="180" class="detail">operations.gleam</text><path d="M835 216 L835 265" stroke="#9ae7cb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="705" y="280" width="260" height="116" rx="14" fill="#173b34" stroke="#9ae7cb"/><text x="723" y="313" class="label">Retain + coordinate</text><text x="723" y="342" class="detail">Render · reconcile · perform</text><text x="723" y="365" class="detail">runtime.mjs</text><path d="M700 335 L645 335" stroke="#9ae7cb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="370" y="280" width="260" height="116" rx="14" fill="#10272b" stroke="#345354"/><text x="388" y="313" class="label">Interpret effects</text><text x="388" y="342" class="detail">perform → browser APIs</text><text x="388" y="365" class="detail">effects.gleam / browser.mjs</text><path d="M365 335 L310 335" stroke="#9ae7cb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="35" y="280" width="260" height="116" rx="14" fill="#10272b" stroke="#345354"/><text x="53" y="313" class="label">Outcome message</text><text x="53" y="342" class="detail">Success, failure, or tick</text><text x="53" y="365" class="detail">Back through dispatch</text><path d="M165 275 L165 220" stroke="#9ae7cb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="36" y="463" class="detail">View + subscriptions are descriptions derived from the retained model.</text><text x="36" y="503" class="detail">The runtime owns execution. Pure operations own application decisions.</text></svg>