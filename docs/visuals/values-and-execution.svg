<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">02 / Meaning and execution</title><desc id="desc">Function values and data descriptions can be inspected before being executed.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#9ae7cb" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,sans-serif}.label{font-size:23px;font-weight:600;fill:#edf6f2}.detail{font-size:18px;fill:#b9cfca}.title{font-size:30px;font-weight:600;fill:#9ae7cb}</style><rect width="1000" height="560" rx="20" fill="#081719"/><text x="36" y="55" class="title">02 / Meaning and execution</text><rect x="35" y="110" width="430" height="116" rx="14" fill="#173b34" stroke="#9ae7cb"/><text x="53" y="143" class="label">Operation: a function value</text><text x="53" y="172" class="detail">Model → #(Model, List(Effect))</text><rect x="535" y="110" width="430" height="116" rx="14" fill="#173b34" stroke="#9ae7cb"/><text x="553" y="143" class="label">Effect: a data value</text><text x="553" y="172" class="detail">SaveDraft(query) · SearchService(id, query)</text><path d="M250 235 L250 305" stroke="#9ae7cb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M750 235 L750 305" stroke="#9ae7cb" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="35" y="320" width="430" height="116" rx="14" fill="#10272b" stroke="#345354"/><text x="53" y="353" class="label">Apply the function</text><text x="53" y="382" class="detail">Calculate a transition</text><rect x="535" y="320" width="430" height="116" rx="14" fill="#10272b" stroke="#345354"/><text x="553" y="353" class="label">Interpret the description</text><text x="553" y="382" class="detail">Interact with the browser</text><text x="35" y="500" class="detail">A description is a value. Carrying it out is an event in the world.</text></svg>