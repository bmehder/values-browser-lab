<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Stop on one frame. Understand one decision.</title><desc id="desc">Three successive model and effect pairs; stale A cannot replace successful B.</desc><style>text{font-family:system-ui,sans-serif}</style><rect width="1000" height="620" rx="20" fill="#081719"/><text x="35" y="55" font-size="28" font-weight="600" fill="#9ae7cb">Stop on one frame. Understand one decision.</text><text x="35" y="100" font-size="19" font-weight="400" fill="#b9cfca">Each frame is a transition output: next model + newly requested effects.</text><rect x="35" y="140" width="270" height="315" rx="12" fill="#173b34" stroke="#9ae7cb"/><text x="53" y="180" font-size="17" font-weight="600" fill="#9ae7cb">01 / START A</text><text x="53" y="236" font-size="22" font-weight="600" fill="#dceee8">Searching A</text><text x="53" y="273" font-size="19" font-weight="400" fill="#dceee8">Query: Gleam</text><text x="53" y="338" font-size="15" font-weight="600" fill="#9ae7cb">NEW EFFECTS</text><text x="53" y="377" font-size="17" font-weight="400" fill="#dceee8">SearchService(A, Gleam)</text><rect x="47" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="79" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="111" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="143" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="175" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="207" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="239" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="271" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="47" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="79" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="111" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="143" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="175" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="207" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="239" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="271" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="365" y="140" width="270" height="315" rx="12" fill="#173b34" stroke="#9ae7cb"/><text x="383" y="180" font-size="17" font-weight="600" fill="#9ae7cb">02 / START B</text><text x="383" y="236" font-size="22" font-weight="600" fill="#dceee8">Searching B</text><text x="383" y="273" font-size="19" font-weight="400" fill="#dceee8">Query: types</text><text x="383" y="338" font-size="15" font-weight="600" fill="#9ae7cb">NEW EFFECTS</text><text x="383" y="377" font-size="17" font-weight="400" fill="#dceee8">SearchService(B, types)</text><rect x="377" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="409" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="441" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="473" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="505" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="537" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="569" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="601" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="377" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="409" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="441" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="473" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="505" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="537" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="569" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="601" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="695" y="140" width="270" height="315" rx="12" fill="#173b34" stroke="#9ae7cb"/><text x="713" y="180" font-size="17" font-weight="600" fill="#9ae7cb">03 / RECEIVE B</text><text x="713" y="236" font-size="22" font-weight="600" fill="#dceee8">Succeeded B</text><text x="713" y="273" font-size="19" font-weight="400" fill="#dceee8">Query: types</text><text x="713" y="338" font-size="15" font-weight="600" fill="#9ae7cb">NEW EFFECTS</text><text x="713" y="377" font-size="17" font-weight="400" fill="#dceee8">[]</text><rect x="707" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="739" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="771" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="803" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="835" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="867" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="899" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="931" y="145" width="16" height="10" rx="2" fill="#081719"/><rect x="707" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="739" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="771" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="803" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="835" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="867" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="899" y="427" width="16" height="10" rx="2" fill="#081719"/><rect x="931" y="427" width="16" height="10" rx="2" fill="#081719"/><text x="35" y="505" font-size="20" font-weight="400" fill="#9ae7cb">Late A: the current search state stays Succeeded B; no new effects.</text><text x="35" y="545" font-size="18" font-weight="400" fill="#b9cfca">The current model summarizes relevant history. It is not the whole history.</text><text x="35" y="580" font-size="18" font-weight="400" fill="#b9cfca">Conceptual frames: the app does not store a complete snapshot reel.</text></svg>